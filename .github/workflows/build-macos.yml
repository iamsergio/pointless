name: Build for macOS

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.preset }} ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        preset: [dev, rel]
        os: [macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Init submodules
      env:
        FORGEJO_USERNAME: ${{ secrets.FORGEJO_USERNAME }}
        FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      run: |
        spix=https://projects.kdab.com/KDAB-Labs/spix.git
        forget_token() {
          git config submodule.3rdparty/spix.url "$spix"
          if [ -e 3rdparty/spix/.git ]; then git -C 3rdparty/spix remote set-url origin "$spix"; fi
        }
        trap forget_token EXIT
        git config submodule.3rdparty/spix.url \
          "https://${FORGEJO_USERNAME}:${FORGEJO_TOKEN}@projects.kdab.com/KDAB-Labs/spix.git"
        git submodule update --init --recursive -- 3rdparty/vcpkg 3rdparty/spix 3rdparty/glaze 3rdparty/cpr

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.0'
        cache: true

    - name: Setup vcpkg
      run: |
        cd 3rdparty/vcpkg
        ./bootstrap-vcpkg.sh

    - name: Configure CMake
      env:
        POINTLESS_SUPABASE_URL: ${{ secrets.POINTLESS_SUPABASE_URL }}
        POINTLESS_SUPABASE_ANON_KEY: ${{ secrets.POINTLESS_SUPABASE_ANON_KEY }}
      run: cmake --preset=${{ matrix.preset }} -DPOINTLESS_BUILD_QT_COMMANDER=OFF

    - name: Build
      run: cmake --build build-${{ matrix.preset }}
