name: Clang-Tidy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  clang-tidy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Init submodules
      run: git submodule update --init --recursive -- 3rdparty/vcpkg 3rdparty/spix 3rdparty/glaze 3rdparty/cpr

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy-20

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.0'
        cache: true

    - name: Print clang-tidy version
      run: clang-tidy --version

    - name: Setup vcpkg
      run: |
        cd 3rdparty/vcpkg
        ./bootstrap-vcpkg.sh

    - name: Create vcpkg cache directory
      run: mkdir -p ${{ github.workspace }}/.cache/vcpkg

    - name: Cache vcpkg binaries
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.cache/vcpkg
        key: vcpkg-bin-${{ runner.os }}-clang-tidy-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-bin-${{ runner.os }}-clang-tidy-

    - name: Configure CMake
      env:
        POINTLESS_SUPABASE_URL: ${{ secrets.POINTLESS_SUPABASE_URL }}
        POINTLESS_SUPABASE_ANON_KEY: ${{ secrets.POINTLESS_SUPABASE_ANON_KEY }}
        POINTLESS_USERNAME: ${{ secrets.POINTLESS_USERNAME }}
        POINTLESS_PASSWORD: ${{ secrets.POINTLESS_PASSWORD }}
        VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite'
      run: cmake --preset=dev -DPOINTLESS_BUILD_QT_COMMANDER=OFF

    - name: Run clang-tidy
      run: RUN_CLANG_TIDY=run-clang-tidy-20 CLANG_TIDY=clang-tidy-20 scripts/run-clang-tidy.sh build-dev
